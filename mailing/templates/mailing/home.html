{% extends 'mailing/base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1>📊 Статистика</h1>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h2>{{ total_mailings }}</h2>
                <p>Всего рассылок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h2>{{ active_mailings }}</h2>
                <p>Активных рассылок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h2>{{ unique_recipients }}</h2>
                <p>Уникальных получателей</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
